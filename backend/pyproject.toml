[project]
name = "scic-indoprima-backend"
version = "0.1.0"
description = "Supply Chain Intelligence Center — AI Decision Intelligence Platform for PT Indoprima"
requires-python = ">=3.11"
dependencies = [
    # ── Core Web Framework ─────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # ── Data Validation ────────────────────────────────────────
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # ── Database ───────────────────────────────────────────────
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "supabase>=2.0.0",
    "duckdb>=1.1.0",
    # ── AI / LLM ───────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-pinecone>=0.2.0",
    "langgraph>=0.2.0",
    "sqlglot>=23.0.0",
    "pinecone-client>=4.0.0",
    # ── Forecasting & ML ───────────────────────────────────────
    "statsforecast>=1.7.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    # ── Background Jobs & Caching ──────────────────────────────
    "arq>=0.26.0",
    "redis>=5.0.0",
    # ── Auth & Security ────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ── Export & Reporting ─────────────────────────────────────
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    # ── HTTP Client ────────────────────────────────────────────
    "httpx>=0.27.0",
    # ── Utilities ──────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
